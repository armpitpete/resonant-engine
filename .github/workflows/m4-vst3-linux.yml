name: M4 VST3 Linux Exact Head

on:
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "core/include/resonant/BreathPipe.hpp"
      - "core/include/resonant/Parameter.hpp"
      - "core/include/resonant/BreathPipeState.hpp"
      - "tests/unit/test_vst3_processor_flush.cpp"
      - "tests/unit/test_vst3_state.cpp"
      - "tests/unit/test_vst3_external_excitation.cpp"
      - "tests/unit/test_vst3_realtime.cpp"
      - "tests/unit/test_vst3_parity.cpp"
      - "tests/unit/test_vst3_conformance.cpp"
      - "cmake/vst3_sdk.cmake"
      - "cmake/check_vst3_realtime_boundary.cmake"
      - "cmake/check_vst3_boundary.cmake"
      - "hosts/vst3/**"
      - ".github/workflows/m4-vst3-linux.yml"

permissions:
  contents: read

concurrency:
  group: m4-vst3-linux-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  vst3-linux:
    runs-on: [self-hosted, Linux, ARM64, oracle-ci, resonant-engine]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Verify raw PR head
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Configure VST3 host
        run: >
          cmake -S . -B build-vst3-linux
          -DRESONANT_ENGINE_BUILD_VST3=ON
          -DRESONANT_ENGINE_BUILD_TESTS=ON
          -DRESONANT_ENGINE_BUILD_RENDER=OFF
          -DRESONANT_ENGINE_WARNINGS_AS_ERRORS=ON
          -DCMAKE_BUILD_TYPE=Release
          -DSMTG_CREATE_PLUGIN_LINK=OFF

      - name: Build VST3 host
        run: cmake --build build-vst3-linux --target ResonantEngineBreathPipe --parallel 2

      - name: Run VST3 control, state, excitation, realtime, parity and conformance regressions
        run: |
          cmake --build build-vst3-linux --target resonant_vst3_processor_flush_tests --parallel 2
          cmake --build build-vst3-linux --target resonant_vst3_state_tests --parallel 2
          cmake --build build-vst3-linux --target resonant_vst3_external_excitation_tests --parallel 2
          cmake --build build-vst3-linux --target resonant_vst3_realtime_tests --parallel 2
          cmake --build build-vst3-linux --target resonant_vst3_parity_tests --parallel 2
          cmake --build build-vst3-linux --target resonant_vst3_conformance_tests --parallel 2
          ctest --test-dir build-vst3-linux -R "resonant_vst3_(processor_flush|state|external_excitation|realtime|parity|conformance)_tests|resonant_vst3_realtime_boundary" --output-on-failure

      - name: Record M4.8 native wrapper CPU scaling
        shell: bash
        run: |
          build-vst3-linux/resonant_vst3_realtime_tests | tee m4-realtime.log
          grep -F "PASS: M4.8 VST3 realtime and boundedness proof" m4-realtime.log
          grep -F "M4.8 CPU_DEADLINE sample_rate=48000" m4-realtime.log
          grep -F "M4.8 CPU_SCALE instances=1" m4-realtime.log
          grep -F "M4.8 CPU_SCALE instances=4" m4-realtime.log
          grep -F "M4.8 CPU_SCALE instances=8" m4-realtime.log
          {
            echo "## M4.8 native wrapper CPU scaling"
            echo
            echo "```text"
            cat m4-realtime.log
            echo "```"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record M4.9 native-core/VST3 parity evidence
        shell: bash
        run: |
          build-vst3-linux/resonant_vst3_parity_tests | tee m4-parity.log
          grep -F "PASS: M4.9 native-core/VST3 parity" m4-parity.log
          grep -F "M4.9 PARITY reference" m4-parity.log
          grep -F "M4.9 TIMING shifted_automation_by=1" m4-parity.log
          grep -F "detected=1" m4-parity.log
          grep -F "M4.9 PARITY chunk_boundary" m4-parity.log
          {
            echo "## M4.9 native-core/VST3 parity"
            echo
            echo "```text"
            cat m4-parity.log
            echo "```"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record M4.10 VST3 conformance evidence
        shell: bash
        run: |
          build-vst3-linux/resonant_vst3_conformance_tests | tee m4-conformance.log
          grep -F "PASS: M4.10 VST3 conformance" m4-conformance.log
          grep -F "M4.10 OFFLINE process_mode=offline finite=1 audible=1" m4-conformance.log
          grep -F "M4.10 LIFECYCLE cycles=8 reset_silence=1 fresh_note_audio=1" m4-conformance.log
          grep -F "M4.10 AUTOMATION malformed_fail_closed=1 extreme_finite=1 recovered_silence=1" m4-conformance.log
          {
            echo "## M4.10 VST3 conformance"
            echo
            echo "\`\`\`text"
            cat m4-conformance.log
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build Steinberg validator
        run: cmake --build build-vst3-linux --target validator --parallel 2

      - name: Validate VST3 host
        shell: bash
        run: |
          validator="build-vst3-linux/bin/Release/validator"
          plugin="build-vst3-linux/VST3/Release/ResonantEngineBreathPipe.vst3"

          test -x "$validator"
          test -d "$plugin"

          echo "Validator: $validator"
          echo "Plugin: $plugin"
          file "$validator"
          find "$plugin" -maxdepth 3 -type f -print

          "$validator" --selftest | tee validator-selftest.log
          grep -F "0 failed test(s)." validator-selftest.log

          set +e
          "$validator" "$plugin" >validator.log 2>&1
          validator_status=$?
          set -e
          cat validator.log
          test "$validator_status" -eq 0
          grep -F "* Loading module..." validator.log
          grep -F "* Scanning classes..." validator.log
          grep -F "[Terminate/Initialize]" validator.log
          grep -F "[Suspend/Resume]" validator.log
          grep -E "Result: [0-9]+ tests passed, 0 tests failed" validator.log
