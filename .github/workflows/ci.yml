name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DRESONANT_ENGINE_BUILD_TESTS=ON -DRESONANT_ENGINE_BUILD_RENDER=ON -DRESONANT_ENGINE_WARNINGS_AS_ERRORS=ON -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

  browser-m1-playtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.6
          actions-cache-folder: emsdk-cache
      - name: Build live M1 AudioWorklet/WASM synth
        run: bash hosts/browser/m1/build.sh
      - name: Verify browser artifact
        run: |
          test -s build/m1-browser/index.html
          test -s build/m1-browser/app.js
          test -s build/m1-browser/worklet.js
          test -s build/m1-browser/resonant-m1.js
          node --check build/m1-browser/app.js
          node --check build/m1-browser/worklet.js
      - name: Upload playable M1 synth
        uses: actions/upload-artifact@v4
        with:
          name: m1-playable-browser-${{ github.sha }}
          if-no-files-found: error
          path: build/m1-browser/

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure ASan and UBSan
        run: cmake -S . -B build-sanitize -DRESONANT_ENGINE_BUILD_TESTS=ON -DRESONANT_ENGINE_BUILD_RENDER=ON -DRESONANT_ENGINE_ENABLE_SANITIZERS=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build-sanitize
      - name: Test
        run: ctest --test-dir build-sanitize --output-on-failure

  no-exceptions-rtti-portability-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile core headers without exceptions/RTTI assumptions
        run: >-
          c++ -std=c++20 -fno-exceptions -fno-rtti -Wall -Wextra -Wpedantic
          -Icore/include -c core/src/Core.cpp -o /tmp/resonant-core-portability.o
