name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DRESONANT_ENGINE_BUILD_TESTS=ON -DRESONANT_ENGINE_BUILD_RENDER=ON -DRESONANT_ENGINE_WARNINGS_AS_ERRORS=ON -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

  browser-lab-build-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.6
          actions-cache-folder: emsdk-cache
      - name: Build Resonant Engine Lab and Node parity module
        env:
          RESONANT_LAB_BUILD_NODE_PARITY: "1"
        run: bash hosts/browser/lab/build.sh
      - name: Verify Lab artifact and contracts
        run: |
          test -s build/resonant-lab/index.html
          test -s build/resonant-lab/app.js
          test -s build/resonant-lab/worklet.js
          test -s build/resonant-lab/capture-worklet.js
          test -s build/resonant-lab/resonant-lab.js
          test -s build/resonant-lab/resonant-lab-node.mjs
          test -s build/resonant-lab/build-info.js
          node --check build/resonant-lab/app.js
          node --check build/resonant-lab/worklet.js
          node --check build/resonant-lab/capture-worklet.js
          node --check hosts/browser/lab/parity.mjs
          python3 -m json.tool lab/contracts/presets.json >/dev/null
          python3 -m json.tool lab/contracts/acceptance-tests.json >/dev/null
      - name: Build native parity signature
        run: |
          cmake -S . -B build-lab-parity -DRESONANT_ENGINE_BUILD_TESTS=ON -DRESONANT_ENGINE_BUILD_RENDER=OFF -DRESONANT_ENGINE_WARNINGS_AS_ERRORS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-lab-parity --target resonant_lab_signature
          ./build-lab-parity/resonant_lab_signature > build/resonant-lab/native-signature.json
      - name: Compare native and WASM signatures
        run: |
          node hosts/browser/lab/parity.mjs build/resonant-lab/resonant-lab-node.mjs > build/resonant-lab/wasm-signature.json
          python3 tests/regression/compare_lab_signatures.py build/resonant-lab/native-signature.json build/resonant-lab/wasm-signature.json
      - name: Upload Lab artifact
        uses: actions/upload-artifact@v4
        with:
          name: resonant-engine-lab-${{ github.sha }}
          if-no-files-found: error
          path: build/resonant-lab/

  browser-lab-smoke:
    needs: browser-lab-build-parity
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit, msedge]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: resonant-engine-lab-${{ github.sha }}
          path: build/resonant-lab
      - name: Install pinned Playwright
        run: npm install --no-save playwright@1.54.1
      - name: Install browser engine
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Start deterministic PulseAudio null sink
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=resonant_ci sink_properties=device.description=Resonant_CI >/dev/null
          pactl set-default-sink resonant_ci
          pactl info
          pactl list short sinks
      - name: Smoke test Lab realtime audio path
        env:
          LAB_BROWSER: ${{ matrix.browser }}
        run: node tests/browser/lab_smoke.mjs build/resonant-lab

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure ASan and UBSan
        run: cmake -S . -B build-sanitize -DRESONANT_ENGINE_BUILD_TESTS=ON -DRESONANT_ENGINE_BUILD_RENDER=ON -DRESONANT_ENGINE_ENABLE_SANITIZERS=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build-sanitize
      - name: Test
        run: ctest --test-dir build-sanitize --output-on-failure

  no-exceptions-rtti-portability-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile core headers without exceptions/RTTI assumptions
        run: >-
          c++ -std=c++20 -fno-exceptions -fno-rtti -Wall -Wextra -Wpedantic
          -Icore/include -c core/src/Core.cpp -o /tmp/resonant-core-portability.o
