name: M4 VST3 Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vst3-build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        config: [Debug, Release]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Record exact dispatched head
        shell: bash
        run: |
          echo "SOURCE_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Configure VST3 host
        run: >
          cmake -S . -B build-vst3
          -DRESONANT_ENGINE_BUILD_VST3=ON
          -DRESONANT_ENGINE_BUILD_TESTS=OFF
          -DRESONANT_ENGINE_BUILD_RENDER=OFF
          -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DSMTG_CREATE_PLUGIN_LINK=OFF

      - name: Build VST3 host
        run: cmake --build build-vst3 --config ${{ matrix.config }} --target ResonantEngineBreathPipe --parallel 2

      - name: Build Steinberg validator
        run: cmake --build build-vst3 --config ${{ matrix.config }} --target validator --parallel 2

      - name: Validate VST3 host
        shell: bash
        run: |
          validator="build-vst3/bin/${{ matrix.config }}/validator"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            validator="${validator}.exe"
          fi
          plugin="build-vst3/VST3/${{ matrix.config }}/ResonantEngineBreathPipe.vst3"
          "${validator}" "${plugin}" | tee validator.log
          grep -E "Result: [0-9]+ tests passed, 0 tests failed" validator.log
