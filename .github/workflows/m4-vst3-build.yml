name: M4 VST3 Build

on:
  pull_request:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "cmake/vst3_sdk.cmake"
      - "hosts/vst3/**"
      - ".github/workflows/m4-vst3-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vst3-build:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'm4/vst3-reference-host'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        config: [Debug, Release]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify PR head
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Configure VST3 host
        run: >
          cmake -S . -B build-vst3
          -DRESONANT_ENGINE_BUILD_VST3=ON
          -DRESONANT_ENGINE_BUILD_TESTS=OFF
          -DRESONANT_ENGINE_BUILD_RENDER=OFF
          -DSMTG_CREATE_PLUGIN_LINK=OFF

      - name: Build VST3 host
        run: cmake --build build-vst3 --config ${{ matrix.config }} --target ResonantEngineBreathPipe --parallel 2
